chunks.max-auto-save-chunks-per-tick:
  - expressions:
      - parseInt(paper["world-defaults.yml"]["chunks"]["max-auto-save-chunks-per-tick"]) >= 24
    prefix: "❌"
    value: "Bu değeri config/paper-world-defaults.yml dosyasında azaltın.\nTavsiye edilen: 6."
