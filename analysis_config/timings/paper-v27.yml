    prefix: "❌"
    value: "Bu özelliği paper.yml dosyasında etkinleştirin."
non-player-arrow-despawn-rate:
  - expressions:
      - parseInt(paper["world-settings"]["default"]["non-player-arrow-despawn-rate"]) == -1
    prefix: "❌"
    value: "Bu değeri paper.yml dosyasında ayarlayın.\nTavsiye edilen: 60"
