projectile.max-loads-per-projectile:
- expressions:
  - parseInt(pufferfish["projectile"]["max-load-per-projectile"]) >= 9
  prefix: "❌"
  value: "Bunu pufferfish.yml dosyasında azaltmanızı öneriyoruz.\nÖnerilen: 8."
dab.enabled:
- expressions:
  - pufferfish["dab"]["enabled"] == "false"
  prefix: "❌"
  value: "Bunu pufferfish.yml dosyasında etkinleştirin."
